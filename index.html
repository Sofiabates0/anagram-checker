<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anagram Checker</title>
<style>
body{font-family:Arial;background:#fff7ed;padding:25px}
main{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}
input{width:100%;padding:12px;box-sizing:border-box;margin:10px 0}
button{padding:12px 18px;background:#ea580c;color:white;border:0;border-radius:7px;cursor:pointer}
#result{padding:15px;background:#ffedd5;margin-top:15px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Anagram Checker</h1>
<p>Compare two words or phrases.</p>
<input id="first" placeholder="First word or phrase">
<input id="second" placeholder="Second word or phrase">
<button onclick="check()">Compare Text</button>
<div id="result">Your result will appear here.</div>
</main>
<script>
function normalize(text){
 return text.toLowerCase().replace(/[^a-z0-9]/g,"").split("").sort().join("");
}
function check(){
 const a=document.getElementById("first").value;
 const b=document.getElementById("second").value;
 const result=document.getElementById("result");
 if(!a.trim()||!b.trim()){
  result.textContent="Please enter both texts.";
  return;
 }
 const first=normalize(a),second=normalize(b);
 if(!first||!second){
  result.textContent="Enter valid letters or numbers.";
  return;
 }
 result.textContent=first===second
 ?"The two texts are anagrams."
 :"The two texts are not anagrams.";
}
</script>
</body>
</html>
